name: TypeIran Cloud Attendance

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typeiran-cloud-attendance
  cancel-in-progress: false

jobs:
  attendance:
    if: vars.TYPEIRAN_AUTOMATION_ENABLED == 'true'
    name: Run one safe attendance cycle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run TypeIran automation
        env:
          TYPEIRAN_STORAGE_STATE_B64: ${{ secrets.TYPEIRAN_STORAGE_STATE_B64 }}
        run: npm run run
