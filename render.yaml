services:
  - type: cron
    name: typeiran-cloud-attendance
    runtime: node
    plan: starter
    region: frankfurt
    schedule: "*/30 * * * *"
    buildCommand: npm install
    startCommand: npm run run
    envVars:
      - key: TINYFISH_API_KEY
        sync: false
      - key: TINYFISH_PROFILE_ID
        value: prof_9a2ee95796624b37
      - key: MAX_POLLS
        value: "8"
